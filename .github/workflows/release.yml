# Builds the Windows installer and attaches it to a release.
#
# Why this matters: without a published installer, "install this app" means
# "install Rust, Node and the MSVC toolchain first", which is a fifteen-minute
# detour most people will not take. scripts/install.ps1 looks here first.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # Rust builds are slow and almost entirely cacheable.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # A release that fails on the machine it lands on is worse than no
      # release, so everything is proven before anything is published.
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:rust

      - run: pnpm tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: screen-drop-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
          generate_release_notes: true
          body: |
            Windows 10 1809 or newer, 64-bit.

            Download the `-setup.exe` below and run it. It is unsigned, so
            Windows will show "Windows protected your PC" -- click **More info**
            then **Run anyway**. It installs per-user; no administrator prompt.

            Or hand your coding agent this repository and ask it to install
            Screen Drop. See [AGENTS.md](AGENTS.md).
