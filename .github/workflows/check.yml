# Compiles both platforms on every push.
#
# The macOS backend is the reason this exists. It is written on a Windows
# machine, which means the only thing standing between "it compiles" and "I
# believe it compiles" is a macOS runner. Without this job the ScreenCaptureKit
# path is a claim rather than a fact.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:web
      - run: pnpm test
      - run: pnpm build

  rust:
    strategy:
      # Both platforms always report, so a macOS failure is never hidden behind
      # a Windows one that stopped the matrix early.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          # macos-15, not 14: screencapturekit pulls in apple-metal, whose Swift
          # bridge uses MTLResidencySet and MTLLogState. Those are Xcode 16 SDK
          # types, and the 14 image ships Xcode 15 — the build fails in a
          # dependency's Swift before it ever reaches our code.
          - os: macos-15
            name: macos
    runs-on: ${{ matrix.os }}
    name: rust (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      # `tauri::generate_context!` reads frontendDist at compile time and fails
      # if it is not there, so the Rust build genuinely depends on the web build
      # having happened. Doing it for real rather than faking a dist directory:
      # a context generated against an empty folder compiles and would ship an
      # app with no interface in it.
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Build
        working-directory: src-tauri
        run: cargo build --all-targets

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test
