# Publishes the demo to GitHub Pages.
#
# The demo is the real cockpit with drawn desktops instead of the capture
# engine, so this is a plain build of the app with one query flag. That is the
# point: a visitor who drags the stage on the demo has used the product.
name: demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run is always newer than the one it replaces.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # A demo that ships broken types is worse than no demo.
      - run: pnpm check:web
      - run: pnpm test

      - run: pnpm build
        env:
          SCREEN_STUFF_BASE: /screen-stuff/

      # Land on the demo rather than a cockpit with nothing in it.
      - run: cp dist/index.html dist/app.html && node scripts/demo-index.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Only once the repository is public.
  #
  # Pages on a private repository needs a paid plan, and this one is private
  # until launch, so deploying would fail on every single push. A workflow that
  # is always red is a workflow nobody reads, and the build above is the part
  # worth watching anyway -- it type-checks, tests and builds the demo whether
  # or not anywhere is ready to serve it. This starts working by itself on the
  # day the repository goes public.
  deploy:
    needs: build
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Says why, rather than leaving a skipped job to be interpreted.
  not-yet:
    needs: build
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "The demo built. It is not published because this repository is"
          echo "still private, and GitHub Pages on a private repository needs a"
          echo "paid plan. Make the repository public, enable Pages under"
          echo "Settings -> Pages (source: GitHub Actions), and the next push"
          echo "deploys it."
